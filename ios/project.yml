name: Maginet
options:
  bundleIdPrefix: zone.evrim
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Maginet:
    type: application
    platform: iOS
    sources:
      - path: Maginet
      - path: Web
        type: folder
    info:
      path: Maginet/Info.plist
      properties:
        CFBundleDisplayName: Maginet
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        PRODUCT_BUNDLE_IDENTIFIER: zone.evrim.maginet
        GENERATE_INFOPLIST_FILE: NO
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
  MaginetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: FullGame.storekit
        buildPhase: resources
    dependencies:
      - target: Maginet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MaginetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Maginet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Maginet:
    build:
      targets:
        Maginet: all
    run:
      storeKitConfiguration: FullGame.storekit
    test:
      targets: [MaginetTests, MaginetUITests]
