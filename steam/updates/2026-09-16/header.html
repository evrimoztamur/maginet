<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Maginet Steam event header</title>
<style>html,body{margin:0;width:1920px;height:622px;background:#002a2a;overflow:hidden}canvas{display:block;image-rendering:pixelated}</style>
<canvas width="1920" height="622" aria-label="Maginet logo over darkened battlefields"></canvas>
<script>
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
window.headerReady=(async()=>{
 const [atlas,shields,patterns,deadlock,beams]=await Promise.all([
  load('../../../static/png/atlas.png'),load('../../../ios/app-store/screenshots/05-shields-ii.png'),
  load('assets/01-animations.png'),load('assets/header-deadlock-source.png'),
  load('../../../ios/app-store/screenshots/04-beams-ii.png')]);
 const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#002a2a';ctx.fillRect(0,0,1920,622);
 function panel(image,crop,x){
  const [sx,sy,sw,sh]=crop,scale=Math.max(480/sw,622/sh),w=sw*scale,h=sh*scale;
  ctx.save();ctx.beginPath();ctx.rect(x,0,480,622);ctx.clip();
  ctx.drawImage(image,sx,sy,sw,sh,Math.round(x+(480-w)/2),Math.round((622-h)/2),Math.round(w),Math.round(h));ctx.restore();
 }
 const ratio=shields.width/2048,br=beams.width/2048;
 panel(shields,[700*ratio,200*ratio,620*ratio,480*ratio],0);
 panel(patterns,[256,104,288,312],480);
 panel(deadlock,[232,84,336,352],960);
 panel(beams,[805*br,120*br,448*br,672*br],1440);
 // Dim the real screenshots, preserving their pixel grid and distinct regions.
 ctx.fillStyle='rgba(0,15,19,0.67)';ctx.fillRect(0,0,1920,622);
 for(const x of [480,960,1440]){
  const seam=ctx.createLinearGradient(x-32,0,x+32,0);seam.addColorStop(0,'rgba(0,15,19,0)');seam.addColorStop(.5,'rgba(0,15,19,.32)');seam.addColorStop(1,'rgba(0,15,19,0)');ctx.fillStyle=seam;ctx.fillRect(x-32,0,64,622);
 }
 // Logo occupies exactly half the header width, with crisp 10x pixel scaling.
 const scale=10,w=96*scale,h=24*scale,x=(1920-w)/2,y=(622-h)/2;
 ctx.drawImage(atlas,0,448,96,24,x,y,w,h);
 document.documentElement.dataset.ready='true';
})();
</script></html>
